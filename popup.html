<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 12px;
        width: 240px;
        background: #111;
        color: #fff;
      }

      .title {
        font-size: 16px;
        margin-bottom: 12px;
        font-weight: bold;
      }

      .container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .label {
        font-size: 14px;
      }

      /* Switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 20px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #444;
        transition: 0.3s;
        border-radius: 20px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        top: 3px;
        background-color: white;
        transition: 0.3s;
        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: #4caf50;
      }

      input:checked + .slider:before {
        transform: translateX(20px);
      }

      .section {
        margin-top: 10px;
        border-top: 1px solid #222;
        padding-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="title">Clarity for Instagram</div>

    <!-- Hide Stories -->
    <div class="container">
      <span class="label">Hide Stories</span>
      <label class="switch">
        <input type="checkbox" id="hideStories" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="section"></div>

    <!-- Hide Feed -->
    <div class="container">
      <span class="label">Hide Feed</span>
      <label class="switch">
        <input type="checkbox" id="hideFeed" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Hide Suggested -->
    <div class="container">
      <span class="label">Hide Suggested</span>
      <label class="switch">
        <input type="checkbox" id="hideSuggested" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Inspirational Quotes -->
    <div class="container">
      <span class="label">Show Quotes</span>
      <label class="switch">
        <input type="checkbox" id="quotesMode" />
        <span class="slider"></span>
      </label>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
